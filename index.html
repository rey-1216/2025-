<style>
:root{
  --bg:#eef6f3; --surface:#ffffff; --ink:#12302f; --muted:#5b716f; --line:#d3e2dd;
  --mango:#f2a100; --mango-soft:#fff0cc; --mango-ink:#5a3b00;
  --hib:#d6336c; --hib-soft:#fde2ec; --hib-ink:#7a1238;
  --leaf:#1f7a63; --leaf-soft:#d9eee6;
  --danger:#c0392b;
  color-scheme:light dark;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0d1b1a; --surface:#152828; --ink:#e7f3ef; --muted:#9bb4ae; --line:#27413f;
    --mango:#ffb52e; --mango-soft:#3a2d0e; --mango-ink:#ffd889;
    --hib:#ff6f9c; --hib-soft:#3e1929; --hib-ink:#ffc2d6;
    --leaf:#4cc39f; --leaf-soft:#15382f;
    --danger:#ff7b6b;
  }
}
:root[data-theme="dark"]{
  --bg:#0d1b1a; --surface:#152828; --ink:#e7f3ef; --muted:#9bb4ae; --line:#27413f;
  --mango:#ffb52e; --mango-soft:#3a2d0e; --mango-ink:#ffd889;
  --hib:#ff6f9c; --hib-soft:#3e1929; --hib-ink:#ffc2d6;
  --leaf:#4cc39f; --leaf-soft:#15382f;
  --danger:#ff7b6b;
}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);}
html{scroll-padding-top:env(safe-area-inset-top,0px);}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN","Hiragino Sans","Noto Sans JP","Yu Gothic",sans-serif;
  font-weight:500;line-height:1.5;-webkit-text-size-adjust:100%;}
button,input{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation}
html,body{overflow-x:hidden}
button:focus-visible,input:focus-visible{outline:3px solid var(--mango);outline-offset:2px}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line);padding:10px 12px 0}
.brand{display:flex;justify-content:space-between;align-items:center;gap:8px;max-width:1320px;margin:0 auto}
.brand h1{font-size:15px;margin:0;font-weight:800;letter-spacing:.02em}
.brand .right{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:13px}
.sound{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 10px;font-size:12px;font-weight:700;color:var(--muted)}
.sound[aria-pressed="true"]{color:var(--leaf);border-color:var(--leaf)}
.tabs{display:flex;gap:2px;overflow-x:auto;max-width:1320px;margin:6px auto 0;scrollbar-width:none}
.tab{flex:1 0 auto;border:0;background:none;padding:10px 10px;font-weight:800;color:var(--muted);border-bottom:3px solid transparent;min-height:44px;white-space:nowrap}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--ink)}
.tab .n{display:inline-block;min-width:20px;padding:0 6px;border-radius:10px;font-size:12px;margin-left:4px;line-height:20px}
.tab .n.c{background:var(--mango);color:#231600}
.tab .n.r{background:var(--hib);color:#fff}

main{max-width:1320px;margin:0 auto;padding:14px 12px 96px;min-height:calc(100vh - 100px)}
h2{font-size:16px;font-weight:800;margin:0 0 10px}
h3{font-size:14px;font-weight:800;margin:18px 0 8px;color:var(--muted)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:16px;margin-bottom:14px}
.empty{color:var(--muted);margin:6px 0;font-size:14px}
.notice{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:20px}

.btn{border:0;border-radius:14px;padding:12px 16px;font-weight:800;min-height:44px;background:var(--leaf-soft);color:var(--ink)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.primary{background:var(--ink);color:var(--bg)}
.btn.big{width:100%;font-size:18px;padding:16px;margin-top:12px}
.btn.ready{background:var(--hib);color:#fff}
.btn.done{background:var(--leaf);color:#fff}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--muted);font-weight:700;padding:6px 12px;min-height:36px;font-size:13px}
.btn.warn{background:var(--danger);color:#fff;border-color:var(--danger)}

/* 待ち時間 */
.wait{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:6px 16px;
  background:var(--mango-soft);color:var(--mango-ink);border-radius:20px;padding:14px 18px;margin-bottom:14px}
.wait .wl{font-size:14px;font-weight:700;margin-right:8px}
.wait .wv{font-size:40px;font-weight:800;line-height:1}
@media (max-width:599px){.wait{padding:12px 14px}.wait .wv{font-size:32px}}
.wait .wsub{font-size:13px;font-weight:700}

/* 受付 */
.rec{display:grid;gap:14px}
.rec .panel{margin-bottom:0}

.p-pay .cart{margin-top:0;border-top:0;padding-top:0}
.p-pay h2{margin-bottom:6px}
.paybar{display:none}
@media (max-width:819px){
  .paybar{display:flex;position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:30;
    align-items:center;justify-content:space-between;gap:10px;background:var(--ink);color:var(--bg);border-radius:18px;padding:10px 10px 10px 16px;box-shadow:0 6px 20px rgba(0,0,0,.25)}
  .paybar strong{font-size:20px}
  .paybar .btn{background:var(--mango);color:#231600}
  .paybar.away{display:none}
}
.sgrid,.reggrid,.mgrid,.rec{grid-template-columns:minmax(0,1fr)}
.sgrid>*,.reggrid>*,.mgrid>*,.rec>*{min-width:0}
.sgrid{display:grid;gap:0 14px}
@media (min-width:1000px){.sgrid{grid-template-columns:1.2fr 1fr;align-items:start}}
.reggrid{display:grid;gap:14px}
@media (min-width:1000px){.reggrid{grid-template-columns:.9fr 1.1fr;align-items:start}.regleft{position:sticky;top:110px}.reggrid h3:first-child{margin-top:0}}
.mgrid{display:grid;gap:0 14px}
@media (min-width:1000px){.mgrid{grid-template-columns:repeat(2,1fr);align-items:start}}
.cats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin-bottom:10px}
.cat{position:relative;border:2px solid var(--line);background:var(--bg);border-radius:18px;padding:14px 8px;min-height:84px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.cat .nm{font-weight:800;font-size:17px;line-height:1.25;text-align:center}
.cat .pr{font-size:13px;color:var(--muted);font-weight:700}
.cat.on{border-color:var(--ink);background:var(--ink);color:var(--bg)}
.cat.on .pr{color:inherit;opacity:.75}
.cat .q{position:absolute;top:-8px;right:-6px;background:var(--mango);color:#231600;border-radius:999px;min-width:26px;height:26px;display:grid;place-items:center;font-size:14px;font-weight:800;padding:0 6px}
.flv-hd{font-size:13px;font-weight:800;color:var(--muted);margin:4px 0 6px}
/* お会計：レジの表示窓とテンキー */
.regdisp{background:var(--ink);color:var(--bg);border-radius:18px;padding:12px 16px;margin:10px 0 10px;display:grid;gap:2px}
.rd-row{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.rd-row span{font-size:14px;font-weight:700;opacity:.75}
.rd-row strong{font-size:24px;font-weight:800;font-variant-numeric:tabular-nums}
.rd-total strong{font-size:40px;line-height:1.15}
.rd-ch strong{color:var(--mango)}
.rd-ch.short strong,.rd-ch.short span{color:#ff8a7a;opacity:1}
.keys{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}

.keys .exact{grid-row:span 2;line-height:1.3}
.keys .zero{grid-column:span 2}
.keys .btn{font-size:28px;min-height:60px;padding:8px;background:var(--surface);border:1px solid var(--line);border-radius:16px;font-variant-numeric:tabular-nums}
.keys .btn:active,.bills .btn:active{background:var(--line)}
.placebtn{font-size:22px;min-height:68px;border-radius:18px}
.keys .btn.fn{font-size:17px;font-weight:800;background:var(--leaf-soft);padding:4px;letter-spacing:-.02em;white-space:nowrap}
.keys .btn.bk{font-size:26px}
@media (max-width:419px){.keys .btn.fn{font-size:14px;letter-spacing:-.06em}.keys .btn.bk{font-size:24px}}
.p-pay .cartlines{max-height:none}
.cathd{display:grid;grid-template-columns:1fr 110px;gap:8px;align-items:end}
.cathd label{font-size:12px;color:var(--muted);font-weight:700;display:grid;gap:4px}
.frow{display:grid;grid-template-columns:1fr auto auto;gap:6px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line)}
.menu-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}
.item{position:relative;text-align:left;border:2px solid var(--line);background:var(--bg);border-radius:16px;padding:12px;min-height:72px;display:flex;flex-direction:column;justify-content:space-between;gap:4px}
.item .nm{font-weight:800;font-size:15px;line-height:1.3}
.item .pr{font-size:14px;color:var(--muted);font-weight:700}
.item.on{border-color:var(--ink)}
.item .q{position:absolute;top:-8px;right:-6px;background:var(--ink);color:var(--bg);border-radius:999px;min-width:26px;height:26px;display:grid;place-items:center;font-size:14px;font-weight:800;padding:0 6px}
.item:disabled{opacity:.45}
.item .so{font-size:12px;color:var(--danger);font-weight:800}
.cart{margin-top:14px;border-top:1px dashed var(--line);padding-top:10px}
.cl{display:flex;align-items:center;gap:8px;padding:4px 0}
.cl .nm{flex:1;font-weight:700}
.cl .am{min-width:72px;text-align:right;font-weight:700}
.qb{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--surface);font-weight:800;font-size:18px;line-height:1}
.cl .qn{min-width:22px;text-align:center;font-weight:800}
.sum,.cash{display:flex;justify-content:space-between;align-items:baseline;padding:6px 0}
.sum strong{font-size:28px;font-weight:800}
.cash strong{font-size:20px;font-weight:800}

/* 注文行 */
.rows{display:grid;gap:6px}
.row{display:grid;grid-template-columns:auto 1fr auto;gap:4px 12px;align-items:center;padding:10px 12px;border-radius:14px;background:var(--bg)}
.row .rno{font-size:22px;font-weight:800;min-width:48px;height:48px;padding:0 8px;border-radius:14px;display:grid;place-items:center;background:var(--line)}
.row .ri{font-size:14px;min-width:0}
/* スマホ：注文の行は「番号＋内容」の下にボタンを並べる */
@media (max-width:599px){
  .row{grid-template-columns:auto 1fr;align-items:start}
  .row .rs{grid-column:2;justify-content:flex-start}
  .row .rno{min-width:44px;height:44px;font-size:20px}
}
.row .rs{display:flex;gap:6px;align-items:center;justify-content:flex-end;flex-wrap:wrap}
.row.st-cooking .rno{background:var(--mango);color:#231600}
.row.st-ready .rno{background:var(--hib);color:#fff}
.row.st-done .rno{background:var(--leaf);color:#fff}
.row.st-done .ri{color:var(--muted)}
.pill{font-size:12px;font-weight:800;border-radius:999px;padding:3px 10px;white-space:nowrap}
.pill.cooking{background:var(--mango-soft);color:var(--mango-ink)}
.pill.ready{background:var(--hib-soft);color:var(--hib-ink)}
.pill.done{background:var(--leaf-soft);color:var(--leaf)}

/* 伝票カード */
.tickets{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.ticket{background:var(--surface);border:1px solid var(--line);border-top:8px solid var(--mango);border-radius:20px;padding:14px;display:flex;flex-direction:column;gap:8px}
.ticket .hd{display:flex;justify-content:space-between;align-items:baseline}
.ticket .no{font-size:48px;font-weight:800;line-height:1}
.ticket .el{font-size:13px;font-weight:800;color:var(--muted)}
.ticket .el.late{color:var(--danger)}
.ticket ul{list-style:none;margin:0;padding:0;font-size:17px;font-weight:700}
.ticket li{display:flex;justify-content:space-between;padding:3px 0;border-bottom:1px dashed var(--line)}
.ticket li:last-child{border-bottom:0}
.ticket .btn{margin-top:auto}
.ticket.rd{border-top-color:var(--hib);background:var(--hib-soft)}
.ticket.rd .no{font-size:72px;color:var(--hib-ink)}
.batch{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.batch span{background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px 12px;font-weight:700;font-size:14px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips span{background:var(--mango-soft);color:var(--mango-ink);border-radius:10px;padding:4px 10px;font-weight:800}

/* 売上 */
.days{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.days .btn{padding:8px 14px;min-height:38px;font-size:14px;background:var(--surface);border:1px solid var(--line)}
.days .btn[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:14px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px}
.stat .l{font-size:13px;color:var(--muted);font-weight:700}
.stat .v{font-size:28px;font-weight:800;line-height:1.2}
.stat.main{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.stat.main .l{color:inherit;opacity:.75}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:15px}
th,td{padding:8px 6px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th:first-child,td:first-child{text-align:left}
th{font-size:13px;color:var(--muted);font-weight:700}
tfoot td{font-weight:800}
.hr{display:grid;grid-template-columns:52px 1fr 88px;gap:8px;align-items:center;font-size:14px;padding:3px 0}
.hr .bar{height:14px;border-radius:7px;background:var(--mango)}
.hr .amt{text-align:right;font-weight:700}
.note{font-size:13px;color:var(--muted);margin:8px 0 0}

/* メニュー設定 */
.mrow{display:grid;grid-template-columns:1fr 96px;gap:8px;padding:10px 0;border-bottom:1px solid var(--line)}
.mrow .acts{grid-column:1 / -1;display:flex;gap:6px;justify-content:flex-end}
@media (min-width:640px){.mrow{grid-template-columns:1fr 110px auto}.mrow .acts{grid-column:auto}}
.in{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:10px 12px;min-height:44px;font-size:16px}
.addrow{display:grid;grid-template-columns:1fr 96px;gap:8px;margin-top:12px}
.addrow .btn{grid-column:1 / -1}
@media (min-width:640px){.addrow{grid-template-columns:1fr 110px auto}.addrow .btn{grid-column:auto}}
.inline{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.inline .in{width:90px}

/* 番号表示 */
.overlay{position:fixed;inset:0;z-index:50;background:rgba(10,25,24,.72);display:grid;place-items:center;padding:20px}
.ov{background:var(--surface);border-radius:28px;padding:28px 24px;text-align:center;max-width:380px;width:100%}
.ov .l{font-weight:800;color:var(--muted)}
.ov .no{font-size:112px;font-weight:800;line-height:1;margin:6px 0 10px}
.ov .ch{font-size:22px;font-weight:800;color:var(--leaf);margin:8px 0 16px}
.ov .it{font-size:15px;color:var(--muted)}
.updbar{display:flex;justify-content:center;align-items:center;gap:12px;flex-wrap:wrap;background:var(--leaf);color:#fff;font-weight:800;font-size:14px;padding:8px 12px}
.updbar[hidden]{display:none}
.updbar .btn{background:#fff;color:var(--leaf);min-height:36px;padding:6px 14px}
.testbar{background:var(--mango);color:#231600;font-weight:800;font-size:13px;text-align:center;padding:4px 12px}
.sound.stest{color:var(--ink)}
.sound.stest.need{background:var(--hib);color:#fff;border-color:var(--hib)}
.brand .right{justify-content:flex-end;flex-shrink:0}
@media (max-width:599px){
  #clock{display:none}
  .brand h1{font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
  .brand .right{gap:6px}
  .sound{padding:4px 8px}
}
.waitchip{display:none}
@media (min-width:820px){
  .waitchip:not([hidden]){display:inline-block;background:var(--mango-soft);color:var(--mango-ink);font-weight:800;font-size:14px;border-radius:999px;padding:4px 12px}
  .waitchip strong{font-size:18px}
  /* iPad・PCでは待ち時間を上のバーに出すので、大きい帯は出さない */
  .wait{display:none}
}
.tbadge{display:inline-block;background:var(--mango-soft);color:var(--mango-ink);font-size:11px;font-weight:800;border-radius:6px;padding:1px 6px;margin-right:6px}
.netbar{background:var(--danger);color:#fff;font-weight:800;font-size:14px;text-align:center;padding:8px 12px}
.pick{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:700;color:var(--muted)}
.pick input{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:6px 8px;min-height:38px;font-size:15px}
.arow{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:8px 12px;border-radius:14px;background:var(--bg)}
.aamt{font-weight:800;font-size:17px;color:var(--leaf)} .aamt.neg{color:var(--danger)}
.adjform{display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px;margin-top:12px}
.adjform .in{min-width:0}
.adjform #adjMemo,.adjform .btn.primary{grid-column:1 / -1}
@media (min-width:700px){.adjform{grid-template-columns:auto 120px 1fr auto}.adjform #adjMemo,.adjform .btn.primary{grid-column:auto}}
.seg{display:flex;gap:4px}
.seg .btn{padding:8px 12px;min-height:44px;background:var(--surface);border:1px solid var(--line)}
.seg .btn[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.row.st-canceled .rno{background:var(--line);color:var(--muted)} .row.st-canceled .ri{color:var(--muted);text-decoration:line-through}
.pill.cx{background:var(--line);color:var(--muted);margin-left:8px}
.editor{border:2px solid var(--ink)}
.erow{display:grid;grid-template-columns:1fr auto auto auto;gap:8px;align-items:center;padding:6px 0;border-bottom:1px dashed var(--line)}
.erow .nm{font-weight:700} .erow .qn{min-width:22px;text-align:center;font-weight:800}
.erow .ep{grid-column:1 / -1;display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);font-weight:700}
.erow .ep .in{width:110px;min-height:38px;padding:6px 10px}
@media (min-width:640px){.erow{grid-template-columns:1fr auto auto auto auto}.erow .ep{grid-column:auto}}
.chipbtns{display:flex;flex-wrap:wrap;gap:6px}
.chipbtns .btn[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.ebtns{display:grid;grid-template-columns:1fr 2fr;gap:8px;margin-top:8px}
.lottog{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:8px}

.regsum span{font-size:14px;color:var(--muted);font-weight:700}
.regsum strong{font-size:18px}
.regsum .eq{border-top:2px solid var(--ink);margin-top:4px;padding-top:8px}
.regsum .eq strong{font-size:24px}
.regsum .res{justify-content:center;padding-top:8px}
.diff{font-size:20px;font-weight:800;border-radius:12px;padding:6px 14px}
.diff.ok{background:var(--leaf);color:#fff}
.diff.ng{background:var(--danger);color:#fff}
.diff.wait{font-size:14px;color:var(--muted);font-weight:700}
.reg-in{max-width:220px}
.coins{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}

.coin span{font-weight:800;font-size:14px}
.coin .in{grid-row:span 2;min-height:40px;padding:6px 10px;text-align:right}
.coin em{font-style:normal;font-size:12px;color:var(--muted);font-weight:700}
td.neg{color:var(--danger);font-weight:800}
.lothd{display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:4px 12px;margin:4px 0 8px;font-weight:700}
.lothd strong{font-size:22px}
.lotinfo{font-size:12px;color:var(--muted)}
.lotgrid{display:grid;grid-template-columns:repeat(10,1fr);gap:4px}
@media (min-width:1200px){.lotn{min-height:44px;font-size:16px}}
@media (max-width:380px){.lotgrid{gap:3px}.lotn{font-size:13px;min-height:36px;border-radius:8px}}
.lotn{border:1px solid var(--line);background:var(--bg);border-radius:10px;min-height:40px;font-weight:800;font-size:15px;padding:0}
.lotn.p2{background:var(--mango-soft);color:var(--mango-ink);border-color:var(--mango)}
.lotn.p3{background:var(--hib-soft);color:var(--hib-ink);border-color:var(--hib)}
.lotn.on{background:var(--ink);color:var(--bg);border-color:var(--ink);border-width:2px}
.lotn:disabled{background:transparent;color:var(--line);border-style:dashed;text-decoration:line-through}
.lotres{display:flex;align-items:baseline;gap:12px;border-radius:16px;padding:12px 14px;margin:4px 0 8px;background:var(--bg)}
.lotres .ln{font-size:32px;font-weight:800}
.lotres .lk{font-size:18px;font-weight:800}
.lotres.p2{background:var(--mango-soft);color:var(--mango-ink)}
.lotres.p3{background:var(--hib-soft);color:var(--hib-ink)}
.lotbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:10px}
.lotbar>span{flex:1;font-weight:800;min-width:120px}
.lotbar.lottop{margin:0 0 8px}
.lotbar.lottop .btn{min-height:44px}
.lotconf .lq{font-size:18px;font-weight:800;margin:4px 0 8px}
.lotconf .lotres{margin:0 0 6px}
.lotsum{text-align:right;font-weight:700;margin:6px 0 4px}
.lotsum strong{font-size:20px}
.slothd{font-weight:800;margin-top:10px;padding-top:6px;border-top:2px solid var(--line)}
.slot{display:grid;grid-template-columns:56px 1fr;gap:8px;align-items:center;padding:6px 0;border-bottom:1px dashed var(--line)}
.slot .sl{font-size:13px;font-weight:800;color:var(--muted)}
.chipbtns .btn.sel{background:var(--ink);color:var(--bg)}
.lotall{background:var(--mango-soft);color:var(--mango-ink);border-radius:16px;padding:14px;font-weight:800;display:grid;gap:10px}

.cl small{color:var(--muted);font-weight:700}
.ov.changed .no{color:var(--danger)}
.ov .ovst{font-weight:800}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:60;background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:14px;font-weight:700;max-width:92vw}
@media (prefers-reduced-motion: no-preference){
  .ticket.new{animation:pop .5s ease}
  @keyframes pop{0%{transform:scale(.94)}60%{transform:scale(1.03)}100%{transform:scale(1)}}
}

<body>
<header class="top">
  <div class="brand">
    <h1 id="appTitle">水あめくじ＆トロピカルジュース</h1>
    <div class="right"><span id="waitChip" class="waitchip" hidden></span><span id="clock"></span><button class="sound stest" id="stest" data-act="stest">音テスト</button><button class="sound" id="sound" data-act="sound" aria-pressed="true">通知音 ON</button></div>
  </div>
  <nav class="tabs" id="tabs" role="tablist"></nav>
</header>
<div id="netbar" class="netbar" hidden role="status">通信できていません。電波を確認してください（自動で再接続します）</div>
<div id="updbar" class="updbar" hidden role="status"><span>新しいバージョンがあります</span><button class="btn" data-act="update">今すぐ更新</button></div>
<div id="testbar" class="testbar" hidden role="status">テストモード中：この間の注文は売上に入りません</div>
<main id="view"></main>
<div id="layer"></div>

<script>
(function(){
  const ROLES=[["reception","受付"],["kitchen","厨房"],["pickup","渡し口"],["sales","売上"],["menu","メニュー"]];
  const $=(s)=>document.querySelector(s);
  const esc=(s)=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  const yen=(n)=>"¥"+Number(n||0).toLocaleString("ja-JP");
  const pad=(n)=>String(n).padStart(2,"0");
  const dayKey=(t)=>{const d=new Date(t);return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());};
  const today=()=>dayKey(now());
  const now=()=>Date.now()+clockSkew;
  const minsSince=(t)=>Math.max(0,Math.floor((now()-t)/60000));
  const dayLabel=(k)=>{const p=k.split("-");return Number(p[1])+"/"+Number(p[2]);};
  function lsGet(k){try{return localStorage.getItem(k)}catch(e){return null}}
  function lsSet(k,v){try{localStorage.setItem(k,v)}catch(e){}}

  let role=lsGet("stall-role")||"reception";
  if(!ROLES.some(r=>r[0]===role)) role="reception";
  let soundOn=lsGet("stall-sound")!=="off";
  let tapAll=lsGet("stall-tapall")!=="off";
  let lastTap=0;
  let dbState="loading", ver=null, polling=false, clockSkew=0;
  // この画面自身のバージョン（<meta name="app-build">）
  const BUILD=(document.querySelector('meta[name="app-build"]')||{}).content||"";
  const DEFAULT_TITLE="水あめくじ＆トロピカルジュース";
  let appTitle="";
  let orders=[], adjs=[], regs=[], moves=[], cats=[], lotRound=1, lotMax=70, lotCart=[], lotPick=null, defaultMin=3, testMode=false, tagCount=18, writeSeq=0, editing=null, eCat=null;
  const loaded={orders:false,menu:false};
  let cart={}, paidStr="", selCat=null, busy=false, armed=null, armTimer=null, salesDay=null;
  let seenIds=new Set(), readyIds=new Set(), firstSnap=true, fresh=new Set();
  let pendingRender=false, adjSign=1, moveSign=-1, regTimer=null, regPending=false;
  const DENOMS=[10000,5000,1000,500,100,50,10,5,1];

  /* ---------- 音 ---------- */
  let actx=null;
  document.addEventListener("pointerdown",()=>{
    try{ if(!actx) actx=new (window.AudioContext||window.webkitAudioContext)(); if(actx.state==="suspended") actx.resume().then(soundLabel,soundLabel); else setTimeout(soundLabel,50); }catch(e){}
  },{passive:true});
  function audioReady(){ return !!(actx&&actx.state==="running"); }
  // 厨房・渡し口で、まだ一度もタップしていない（音が出せない）ときは目立たせる
  function soundLabel(){
    const st=document.getElementById("stest"); if(!st) return;
    const need=soundOn&&(role==="kitchen"||role==="pickup")&&!audioReady();
    st.textContent=need?(innerWidth<600?"🔈 音を有効に":"🔈 タップして音を有効に"):"音テスト"; st.classList.toggle("need",need);
  }
  function beep(freq,times,force){
    if(!soundOn&&!force) return;
    try{ if(navigator.vibrate) navigator.vibrate(200); }catch(e){}
    if(!actx) return;
    for(let i=0;i<times;i++){
      const t=actx.currentTime+i*0.28, o=actx.createOscillator(), g=actx.createGain();
      o.type="sine"; o.frequency.value=freq;
      g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(0.35,t+0.02); g.gain.exponentialRampToValueAtTime(0.0001,t+0.22);
      o.connect(g); g.connect(actx.destination); o.start(t); o.stop(t+0.24);
    }
  }

  /* ---------- サーバー通信（Apps Script） ---------- */
  /* Apps Script のウェブアプリのURL（/exec で終わるもの）は config.js に書く。
     ファイルの中からURLだけを探して使うので、引用符や書き方が多少崩れていても読める */
  let API_URL="", cfgProblem="", cfgFound="";

  let viaFetch=false;
  async function loadConfig(){
    if(location.protocol==="file:"&&window.STALL_API_URL){ API_URL=String(window.STALL_API_URL).trim(); }
    else {
      let text="";
      try{
        const r=await fetch("config.js?v="+Date.now(),{cache:"no-store",credentials:"omit"});
        if(!r.ok){ cfgProblem="notfound"; return; }
        text=await r.text();
      }catch(e){ cfgProblem="notfound"; return; }
      const m=text.match(/https:\/\/script\.google\.com\/[^\s"'“”‘’<>`;]+/);
      if(!m){ cfgProblem="nourl"; return; }
      API_URL=m[0].replace(/[\/.,、。]+$/,"");
    }
    // 複数アカウントでコピーしたときに入る「/u/数字」は取り除く
    API_URL=API_URL.replace(/\/macros\/u\/\d+\/s\//,"/macros/s/");
    cfgFound=API_URL;
    if(!/^https:\/\/script\.google\.com\/macros\/s\/[^\/]+\/exec$/.test(API_URL)){ cfgProblem=/\/dev$/.test(API_URL)?"dev":"notexec"; return; }
    viaFetch=true;
  }
  const viaGAS=()=>!!(window.google&&google.script&&google.script.run);
  const hasGAS=()=>viaFetch||viaGAS();
  function api(fn){
    const args=[].slice.call(arguments,1);
    if(!viaFetch){
      return new Promise((ok,ng)=>{ google.script.run.withSuccessHandler(ok).withFailureHandler(ng)[fn].apply(null,args); });
    }
    // ログイン情報を送らずに通信する（どのアカウントでログインしていても動く）
    return fetch(API_URL,{method:"POST",credentials:"omit",redirect:"follow",
        headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({fn:fn,args:args})})
      .then(r=>{ if(!r.ok) throw new Error("通信に失敗しました（"+r.status+"）"); return r.json(); })
      .then(j=>{ if(!j||!j.ok) throw new Error((j&&j.error)||"通信に失敗しました"); return j.data; });
  }
  function handleErr(e){
    const m=e&&e.message?String(e.message):"";
    toast(m&&/[ぁ-んァ-ン一-龥]/.test(m)? m.replace(/^Error:\s*/,"") : "通信に失敗しました。電波を確認してもう一度押してください。");
    poll(true);
  }
  function applyState(s){
    if(!s) return;
    if(s.serverNow) clockSkew=s.serverNow-Date.now();
    // 古い状態（自分の書き込みより前に読まれたもの）は使わない
    if(ver&&s.ver&&Number(s.ver)<Number(ver)) return;
    if(s.unchanged){ ver=s.ver; return; }
    ver=s.ver;
    tagCount=s.tagCount==null?18:Number(s.tagCount);
    appTitle=String(s.title||"").trim();
    { const tt=appTitle||DEFAULT_TITLE; const el=document.getElementById("appTitle"); if(el&&el.textContent!==tt) el.textContent=tt; document.title=tt; }
    if(s.lottery){ lotRound=Number(s.lottery.round)||1; lotMax=Number(s.lottery.max)||70; }
    orders=s.orders||[];
    adjs=s.adjustments||[];
    regs=s.registers||[];
    moves=s.cashMoves||[];
    if(editing&&!editing.paper&&!orders.some(o=>o.id===editing.id)) editing=null;
    cats=Array.isArray(s.cats)?s.cats:[];
    defaultMin=Number(s.defaultMin)||3;
    testMode=!!s.testMode;
    Object.keys(cart).forEach(k=>{ const r=lookup(k); if(!r||(r.fl&&r.fl.soldOut)) delete cart[k]; });
    if(selCat&&!cats.some(c=>c.id===selCat)) selCat=null;
    loaded.orders=true; loaded.menu=true;
    if(dbState!=="ok"){ dbState="ok"; }
    notify(); scheduleRender();
  }
  let wq=Promise.resolve();
  let writing=0;
  function q(fn){
    writing++; writeSeq++;
    // 続けて押したときは、最後の書き込みの結果だけを画面に反映（途中の結果で一瞬戻るのを防ぐ）
    wq=wq.then(fn).then(s=>{ if(writing<=1) applyState(s); else if(s&&s.ver) ver=String(Math.max(Number(ver)||0,Number(s.ver))); })
      .catch(handleErr).finally(()=>{writing--;});
    return wq;
  }
  function updOrder(id,data){
    const o=orders.find(x=>x.id===id);
    if(o){ Object.assign(o,data); notify(); render(); }   // 先に画面だけ変える
    return q(()=>api("setStatus",id,data.status));
  }
  function saveMenu(cs,dm,seed){
    if(!cs.length&&cats.length){ toast("メニューを空にすることはできません"); return; }
    cats=cs; defaultMin=dm; render();
    return q(()=>api("saveMenu",cs,dm,!!seed));
  }
  async function poll(force){
    if(polling||!hasGAS()||((writing||regPending)&&!force)) return;
    if(!force&&document.hidden) return;
    polling=true;
    const seq=writeSeq;
    try{ const s=await api("getState",force?null:ver); if(seq===writeSeq&&!writing&&!regPending) applyState(s); offline(false); }
    catch(e){ offline(true); }
    finally{ polling=false; }
  }
  let offlineShown=false;
  function offline(on){
    if(on===offlineShown) return; offlineShown=on;
    const b=document.getElementById("netbar"); if(b) b.hidden=!on;
  }
  const cloneCats=()=>JSON.parse(JSON.stringify(cats));
  const getPaid=()=>Number(paidStr)||0;

  let toastTimer=null;
  function toast(msg,action){
    const l=$("#layer"); let t=l.querySelector(".toast");
    if(!t){ t=document.createElement("div"); t.className="toast"; t.setAttribute("role","status"); l.appendChild(t); }
    t.textContent=msg;
    if(action){ const b=document.createElement("button"); b.className="tbtn"; b.textContent=action.label; b.dataset.act=action.act; b.dataset.id=action.id; t.appendChild(b); }
    clearTimeout(toastTimer); toastTimer=setTimeout(()=>t.remove(),action?6000:3500);
  }

  /* ---------- 集計 ---------- */
  const byCreated=(a,b)=>(a.createdAt||0)-(b.createdAt||0);
  const noLabel=(o)=>(o.test?"T":(o.paper?"紙":""))+o.no;
  const itemsText=(o)=>(o.items||[]).map(i=>i.lotTicket?`<span class="lottag">くじ${i.lot}</span>`:esc(i.name)+"×"+i.qty).join("、");
  function todays(){ const t=today(); return orders.filter(o=>o.day===t); }
  function waitInfo(){
    const rs=todays().filter(o=>o.readyAt&&o.status!=="canceled").sort((a,b)=>a.readyAt-b.readyAt);
    const s=[];
    for(let i=0;i<rs.length;i++){
      const start=Math.max(rs[i].createdAt||0, i? rs[i-1].readyAt:0);
      const d=(rs[i].readyAt-start)/60000;
      if(d>0.1&&d<30) s.push(d);
    }
    const last=s.slice(-8);
    const cooking=todays().filter(o=>o.status==="cooking").length;
    const measured=last.length>=3;
    const per=measured? last.reduce((a,b)=>a+b,0)/last.length : defaultMin;
    return {min:Math.max(1,Math.ceil((cooking+1)*per)), measured:measured, cooking:cooking};
  }
  function lookup(key){
    const sp=key.split("|"), c=cats.find(x=>x.id===sp[0]); if(!c) return null;
    const fl=sp[1]?(c.flavors||[]).find(x=>x.id===sp[1]):null; if(sp[1]&&!fl) return null;
    return {cat:c,fl:fl};
  }
  function cartItems(){
    const normal=Object.keys(cart).filter(k=>cart[k]>0).map(k=>{
      const r=lookup(k); if(!r) return null;
      return {id:k,name:r.cat.name+(r.fl?" "+r.fl.name:""),cat:r.cat.name,flavor:r.fl?r.fl.name:"",price:Number(r.cat.price)||0,qty:cart[k]};
    }).filter(Boolean);
    return mergeLines(normal.concat(...lotCart.map(lotLines)));
  }
  const catQty=(cid)=>Object.keys(cart).filter(k=>k.split("|")[0]===cid).reduce((a,k)=>a+cart[k],0)+lotCart.filter(e=>e.cid===cid).length;

  /* ---------- くじ ---------- */
  // 1 → 3個、7の倍数 → 2個、それ以外 → 1個
  const lotPieces=(n)=>n===1?3:(n%7===0?2:1);
  // 今の回でもう出た番号（取消した注文は除く）。exceptId の注文は数えない
  function drawnSet(exceptId,extra){
    const s=new Set();
    orders.forEach(o=>{ if(o.status==="canceled"||o.id===exceptId) return;
      (o.items||[]).forEach(i=>{ if(i.lotTicket&&Number(i.round)===lotRound) s.add(Number(i.lot)); }); });
    lotCart.forEach(e=>s.add(e.num));
    (extra||[]).forEach(n=>s.add(n));
    return s;
  }
  function lotStatus(set){
    const left=lotMax-[...set].filter(n=>n>=1&&n<=lotMax).length;
    let sev=0, sevLeft=0; for(let k=7;k<=lotMax;k+=7){ sev++; if(!set.has(k)) sevLeft++; }
    return {left:left, one:!set.has(1), sev:sev, sevLeft:sevLeft};
  }
  // くじ1回分 → 注文の行（くじの行 ＋ おまけの水あめの行）
  function lotLines(e){
    const c=cats.find(x=>x.id===e.cid); if(!c) return [];
    const n=lotPieces(e.num), fs=c.flavors||[];
    const out=[{id:"lot|"+c.id+"|"+e.num,name:c.name+" くじ"+e.num+"番",cat:c.name,flavor:"",price:Number(c.price)||0,qty:1,lotTicket:true,lot:e.num,fl:e.fl.slice(),round:e.round==null?undefined:e.round}];
    if(!fs.length){ out.push({id:c.id+"|",name:c.name,cat:c.name,flavor:"",price:0,qty:n,bonus:true}); return out; }
    const cnt={}; e.fl.forEach(f=>{cnt[f]=(cnt[f]||0)+1;});
    Object.keys(cnt).forEach(fid=>{ const f=fs.find(x=>x.id===fid);
      out.push({id:c.id+"|"+fid,name:c.name+" "+(f?f.name:"?"),cat:c.name,flavor:f?f.name:"",price:0,qty:cnt[fid],bonus:true}); });
    return out;
  }
  // 同じ商品のおまけの行はまとめる
  function mergeLines(list){
    const out=[];
    list.forEach(i=>{ const ex=!i.lotTicket&&out.find(x=>x.id===i.id&&!x.lotTicket&&!!x.bonus===!!i.bonus);
      if(ex) ex.qty+=i.qty; else out.push(Object.assign({},i)); });
    return out.sort((a,b)=>(b.lotTicket?1:0)-(a.lotTicket?1:0));   // くじの行を先に
  }
  function lotPickerHTML(c,target,blocked){
    const st=lotStatus(blocked);
    const head=`<div class="lothd"><span>くじ 残り <strong>${st.left}</strong> / ${lotMax}枚</span>
      <span class="lotinfo">1番（3個）：${st.one?"まだ出ていない":"出た"}　7の倍数（2個）：残り${st.sevLeft}/${st.sev}</span></div>`;
    if(target==="cart"&&st.left<=0&&!lotPick) return head+`<div class="lotall">くじが全部出ました。箱に戻したら、リセットしてください。
      <button class="btn ${armed==="lotreset"?"warn":"primary"}" data-act="lotreset">${armed==="lotreset"?"本当にリセット":"くじをリセット"}</button></div>`;
    const P=(lotPick&&lotPick.cid===c.id)?lotPick:{cid:c.id,nums:[],stage:"pick",fl:{}};
    const fs=(c.flavors||[]).filter(f=>!f.soldOut);
    const nums=P.nums.slice().sort((a,b)=>a-b);
    const total=nums.reduce((a,n)=>a+lotPieces(n),0);
    const tag=(n)=>{const k=lotPieces(n); return k===3?"大当たり":(k===2?"当たり":"");};

    // ① 番号を選ぶ（何枚でも）
    if(P.stage==="pick"){
      let g=""; for(let n=1;n<=lotMax;n++){ const out=blocked.has(n), p=lotPieces(n), on=nums.includes(n);
        g+=`<button class="lotn${p===3?" p3":(p===2?" p2":"")}${on?" on":""}" data-act="lotnum" data-id="${c.id}" data-v="${n}" ${out?"disabled":""} aria-pressed="${on}" aria-label="${n}番${out?"（出た）":""}">${n}</button>`; }
      return head+`<div class="lotbar lottop">${nums.length?`<span>${nums.map(n=>n+"番").join("・")}</span>`:`<span class="lotinfo">出たくじの番号をタップ（2回・3回引いた人は全部選ぶ）</span>`}
          ${nums.length?`<button class="btn ghost" data-act="lotclear">選び直す</button>`:""}
          <button class="btn primary" data-act="lotnext" ${nums.length?"":"disabled"}>次へ（${nums.length}枚）</button></div>
        <div class="lotgrid">${g}</div>`;
    }
    // ② 確認
    if(P.stage==="confirm"){
      return head+`<div class="lotconf"><div class="lq">このくじでいいですか？</div>
        ${nums.map(n=>{const k=lotPieces(n); return `<div class="lotres p${k}"><span class="ln">${n}番</span><span class="lk">${tag(n)?tag(n)+"！ ":""}${esc(c.name)} ${k}個</span></div>`;}).join("")}
        <div class="lotsum">くじ ${nums.length}枚 ・ ${esc(c.name)} 合計 <strong>${total}個</strong> ・ ${yen((Number(c.price)||0)*nums.length)}</div></div>
        <div class="ebtns"><button class="btn" data-act="lotback">番号を直す</button>
        <button class="btn primary" data-act="lotyes">はい</button></div>`;
    }
    // ③ 1個ずつ味を選ぶ
    const done=nums.every(n=>{const a=P.fl[n]||[]; let c2=0; for(let i=0;i<lotPieces(n);i++) if(a[i]) c2++; return c2===lotPieces(n);});
    const slots=nums.map(n=>{const k=lotPieces(n); let s2=`<div class="slothd">${n}番（${k}個）</div>`;
      for(let i=0;i<k;i++){ const cur=(P.fl[n]||[])[i];
        s2+=`<div class="slot"><span class="sl">${k>1?(i+1)+"個目":"味"}</span><div class="chipbtns">${fs.map(f=>`<button class="btn${cur===f.id?" sel":""}" data-act="lotfl" data-n="${n}" data-i="${i}" data-id="${f.id}" aria-pressed="${cur===f.id}">${esc(f.name)}</button>`).join("")}</div></div>`; }
      return s2;}).join("");
    return head+`<div class="flv-hd">味を選ぶ（合計${total}個）</div>${slots}
      ${fs.length>1?`<div class="lotbar"><span class="lotinfo">まとめて：</span>${fs.map(f=>`<button class="btn ghost" data-act="lotall" data-id="${f.id}">全部${esc(f.name)}</button>`).join("")}</div>`:""}
      <div class="ebtns"><button class="btn" data-act="lotback">戻る</button>
      <button class="btn primary" data-act="lotok" ${done?"":"disabled"}>${target==="cart"?"注文に入れる":"この注文に追加"}</button></div>`;
  }
  function cartTotal(){ return cartItems().reduce((a,i)=>a+i.price*i.qty,0); }

  /* ---------- 描画 ---------- */
  function badge(k){
    if(dbState!=="ok") return "";
    const t=todays();
    if(k==="kitchen"){ const n=t.filter(o=>o.status==="cooking").length; return n?`<span class="n c">${n}</span>`:""; }
    if(k==="pickup"){ const n=t.filter(o=>o.status==="ready").length; return n?`<span class="n r">${n}</span>`:""; }
    return "";
  }

        nourl:"config.js は見つかりましたが、中に Apps Script のURLがありません。「ここにURLを貼る」の部分を、<b>https://script.google.com/macros/s/…/exec</b> の形のURLに置き換えてください。",
        dev:"config.js のURLが <b>/dev</b> で終わっています。これはテスト用のURLで、作った本人しか使えません。「デプロイを管理」に出ている <b>/exec</b> で終わるURLを貼ってください。",
        notexec:"config.js のURLの形が違います。Apps Script の「デプロイを管理」に出ている、<b>/exec</b> で終わるウェブアプリのURLを貼ってください。"
      }[cfgProblem]||"Apps Script のウェブアプリのURLを確認してください。";
      v.innerHTML=`<div class="notice"><h2>データに接続できません</h2><p class="empty">${why}</p>${cfgFound?`<p class="note" style="word-break:break-all">読み取ったURL：${esc(cfgFound)}</p>`:""}<button class="btn primary" data-act="update">開き直す</button></div>`;
      return;
    }
    if(dbState==="revoked"){ v.innerHTML=`<div class="notice"><h2>接続が切れました</h2><p class="empty">ページを読み込み直してください。</p></div>`; return; }
    if(dbState==="loading"||!loaded.orders||!loaded.menu){ v.innerHTML=`<p class="empty">読み込み中…</p>`; return; }
    $("#testbar").hidden=!testMode;
    { const wc=$("#waitChip"); if(dbState==="ok"){ const w=waitInfo(); wc.innerHTML=`待ち 約<strong>${w.min}</strong>分`; wc.hidden=false; } else wc.hidden=true; }
    v.innerHTML=({reception:viewReception,kitchen:viewKitchen,pickup:viewPickup,sales:viewSales,menu:viewMenu})[role]();
    fresh.clear();
    syncPaybar();
  }

            <button class="qb" data-act="dec" data-id="${i.id}" aria-label="${esc(i.name)}を1つ減らす">−</button>

    const ready=t.filter(o=>o.status==="ready").sort(byCreated);

  function viewSales(){
    const real=orders.filter(o=>!o.test);
    const valid=real.filter(o=>o.status!=="canceled");
    const days=[...new Set(real.map(o=>o.day).concat(adjs.map(a=>a.day)).concat([today()]).concat(salesDay&&salesDay!=="all"?[salesDay]:[]))].sort().reverse();
    if(!salesDay) salesDay=today();
    const inDay=(d)=>salesDay==="all"||d===salesDay;
    const list=valid.filter(o=>inDay(o.day));
    const dayAdjs=adjs.filter(a=>inDay(a.day)).sort((a,b)=>(a.createdAt||0)-(b.createdAt||0));
    const adjSum=dayAdjs.reduce((a,x)=>a+x.amount,0);
    const canceled=real.filter(o=>o.status==="canceled"&&inDay(o.day)).length;
    const orderTotal=list.reduce((a,o)=>a+(o.total||0),0);
    const total=orderTotal+adjSum;
    const cups=list.reduce((a,o)=>a+(o.items||[]).reduce((b,i)=>b+(i.lotTicket?0:i.qty),0),0);
    const lots=list.reduce((a,o)=>a+(o.items||[]).filter(i=>i.lotTicket).length,0);
    const avg=list.length?Math.round(orderTotal/list.length):0;
    const per={};
    list.forEach(o=>(o.items||[]).forEach(i=>{ if(i.lotTicket) return; const k=i.name; if(!per[k]) per[k]={qty:0,amt:0,bonus:0}; per[k].qty+=i.qty; per[k].amt+=i.price*i.qty; if(i.bonus) per[k].bonus+=i.qty;}));
    const perKeys=Object.keys(per).sort((a,b)=>per[b].amt-per[a].amt);
    const pc={}; list.forEach(o=>(o.items||[]).forEach(i=>{const k=i.cat||i.name; if(!pc[k]) pc[k]={qty:0,amt:0,lots:0}; if(i.lotTicket) pc[k].lots++; else pc[k].qty+=i.qty; pc[k].amt+=i.price*i.qty;}));
    const pcKeys=Object.keys(pc).sort((a,b)=>pc[b].amt-pc[a].amt);
    const hours={}; list.forEach(o=>{const h=new Date(o.createdAt).getHours(); hours[h]=(hours[h]||0)+(o.total||0);});
    const hk=Object.keys(hours).map(Number).sort((a,b)=>a-b);

  function regOf(day){ return regs.find(r=>r.day===day)||{day:day,float:null,counted:null,coins:{}}; }
  function coinSum(c){ return DENOMS.reduce((a,d)=>a+d*(Number((c||{})[d])||0),0); }
  function coinUsed(c){ return DENOMS.some(d=>Number((c||{})[d])>0); }
  function salesOfDay(day){
    const o=orders.filter(x=>!x.test&&x.status!=="canceled"&&x.day===day).reduce((a,x)=>a+(x.total||0),0);
    return o+adjs.filter(a=>a.day===day).reduce((a,x)=>a+x.amount,0);
  }
  function regCalc(day){
    const r=regOf(day), fl=Number(r.float)||0, sales=salesOfDay(day);
    const mv=moves.filter(m=>m.day===day), mvSum=mv.reduce((a,m)=>a+m.amount,0);
    const expected=fl+sales+mvSum;
    const counted=coinUsed(r.coins)?coinSum(r.coins):(r.counted==null?null:Number(r.counted));
    return {r,fl,sales,mv,mvSum,expected,counted,diff:counted==null?null:counted-expected};
  }
  function diffHTML(d){
    if(d==null) return `<span class="diff wait">現金を数えると表示されます</span>`;
    if(d===0) return `<span class="diff ok">ぴったり合っています</span>`;
    return `<span class="diff ng">${d>0?yen(d)+" 多い":yen(-d)+" 足りない"}</span>`;
  }
  function viewRegister(){
    if(salesDay==="all"){
      const days=[...new Set(orders.filter(o=>!o.test).map(o=>o.day).concat(adjs.map(a=>a.day),regs.map(r=>r.day),moves.map(m=>m.day)))].sort();
      if(!days.length) return "";
      return `<section class="panel"><h2>レジ締め（日ごと）</h2><div class="tw"><table>
        <thead><tr><th>日付</th><th>売上</th><th>あるべき金額</th><th>数えた現金</th><th>差額</th></tr></thead>
        <tbody>${days.map(d=>{const c=regCalc(d); return `<tr><td>${dayLabel(d)}</td><td>${yen(c.sales)}</td><td>${yen(c.expected)}</td><td>${c.counted==null?"—":yen(c.counted)}</td><td class="${c.diff?"neg":""}">${c.diff==null?"—":(c.diff===0?"0":(c.diff>0?"+":"−")+yen(Math.abs(c.diff)))}</td></tr>`;}).join("")}</tbody>
      </table></div></section>`;
    }
    const c=regCalc(salesDay), useCoins=coinUsed(c.r.coins);
    return `<section class="panel reg">
      <h2>レジ締め（${dayLabel(salesDay)}）</h2>
      <div class="reggrid"><div class="regleft">
      <div class="regsum">
        <div><span>釣り銭準備金</span><strong>${yen(c.fl)}</strong></div>
        <div><span>＋ 売上合計</span><strong>${yen(c.sales)}</strong></div>
        <div><span>${c.mvSum<0?"− ":"＋ "}売上以外の出し入れ</span><strong>${yen(Math.abs(c.mvSum))}</strong></div>
        <div class="eq"><span>＝ レジにあるべき金額</span><strong>${yen(c.expected)}</strong></div>
        <div><span>数えた現金</span><strong>${c.counted==null?"—":yen(c.counted)}</strong></div>
        <div class="res">${diffHTML(c.diff)}</div>
      </div>
      </div><div class="regright">

      <h3>① 釣り銭準備金（最初にレジへ入れた金額）</h3>
      <input class="in reg-in" id="regFloat" type="number" inputmode="numeric" min="0" placeholder="例：10000" value="${c.r.float==null?"":c.r.float}" aria-label="釣り銭準備金">

      <h3>② 売上以外の出し入れ（買い出し・両替など）</h3>
      ${c.mv.length?`<div class="rows">${c.mv.map(m=>`<div class="arow">
        <span class="aamt ${m.amount<0?"neg":""}">${m.amount>0?"入 +":"出 −"}${yen(Math.abs(m.amount))}</span>
        <span class="ri">${esc(m.memo)||"（理由なし）"}</span>
        ${armed==="m:"+m.id?`<button class="btn ghost warn" data-act="mdel" data-id="${m.id}">本当に消す</button>`:`<button class="btn ghost" data-act="mdel" data-id="${m.id}">削除</button>`}
      </div>`).join("")}</div>`:`<p class="empty">ありません</p>`}
      <div class="adjform">
        <div class="seg" role="group" aria-label="出したか入れたか">
          <button class="btn" aria-pressed="${moveSign<0}" data-act="msign" data-v="-1">出した</button>

        <button class="btn primary" data-act="madd">記録する</button>

      <h3>③ 数えた現金</h3>
      <div class="coins">${DENOMS.map(d=>`<label class="coin"><span>${d.toLocaleString("ja-JP")}円</span>
        <input class="in" type="number" inputmode="numeric" min="0" data-coin="${d}" value="${Number(c.r.coins[d])||""}" placeholder="0" aria-label="${d}円の枚数">
        <em>${Number(c.r.coins[d])?yen(d*Number(c.r.coins[d])):""}</em></label>`).join("")}</div>
      <div class="sum"><span>枚数からの合計</span><strong>${yen(coinSum(c.r.coins))}</strong></div>

        <input type="number" inputmode="numeric" min="0" id="regCounted" value="${!useCoins&&c.r.counted!=null?c.r.counted:""}" ${useCoins?"disabled":""} aria-label="数えた現金の合計"></label>
      <p class="note">差額が出たときは、取消した注文の返金、修正した注文の差額の受け渡し、記録していない出し入れがないかを確認してください。</p>
      </div></div>
    </section>`;
  }
  function saveReg(day,patch){
    const i=regs.findIndex(r=>r.day===day);
    const cur=i>=0?regs[i]:{day:day,float:null,counted:null,coins:{}};
    const next=Object.assign({},cur,patch,{coins:Object.assign({},cur.coins,patch.coins||{})});
    if(i>=0) regs[i]=next; else regs.push(next);
    scheduleRender();
    clearTimeout(regTimer); regPending=true; writeSeq++;   // 保存待ちの間は他端末の更新で上書きしない
    regTimer=setTimeout(()=>{ regPending=false; q(()=>api("saveRegister",day,{float:next.float,counted:next.counted,coins:next.coins})); },500);
  }

  // 修正画面で選べないくじの番号（今日の注文のときだけ、今の回で出た番号を止める）

    const day=editing.paper?salesDay:(orders.find(x=>x.id===editing.id)||{}).day;

    const mine=editing.items.filter(i=>i.lotTicket&&(i.round==null||Number(i.round)===lotRound)).map(i=>Number(i.lot));
    return drawnSet(editing.id,mine);
  }

  /* ---------- 番号表示 ---------- */
  function showOverlay(o){
    const l=$("#layer");
    l.querySelectorAll(".overlay").forEach(x=>x.remove());
    const d=document.createElement("div");
    d.className="overlay"; d.setAttribute("role","dialog"); d.setAttribute("aria-label","注文番号"); d.dataset.oid=o.id;
    d.innerHTML=`<div class="ov"><div class="l">番号札</div><div class="no">${noLabel(o)}</div><div class="it ovst">${o.pending?"保存中…":"この番号札をお渡しください"}</div>${o.test?`<div class="it">テストの注文（売上に入りません）</div>`:""}
      <div class="it">${itemsText(o)}</div>
      <div class="ch">${o.change>0?"おつり "+yen(o.change):"おつりなし"}</div>
      <button class="btn primary big" data-act="closeov">次の注文へ</button></div>`;
    l.appendChild(d);
    const b=d.querySelector("button"); if(b) b.focus();
  }

  function confirmOverlay(tmp,real){
    const d=document.querySelector('.overlay[data-oid="'+tmp.id+'"]');
    if(!d) { if(real&&real.no!==tmp.no) toast("番号札が "+noLabel(real)+" に変わりました（"+noLabel(tmp)+" ではありません）"); return; }
    const st=d.querySelector(".ovst");
    if(real&&real.no!==tmp.no){
      d.querySelector(".no").textContent=noLabel(real);
      d.querySelector(".ov").classList.add("changed");
      if(st) st.textContent="番号が変わりました。この番号札をお渡しください";
    } else if(st) st.textContent="この番号札をお渡しください";
  }
  function failOverlay(tmp){
    const d=document.querySelector('.overlay[data-oid="'+tmp.id+'"]'); if(d) d.remove();
  }

  // スマホ：お会計が画面に見えている間は、下の「お会計へ」バーを隠す
  function syncPaybar(){
    const bar=document.querySelector(".paybar"), sec=document.getElementById("paySec");
    if(!bar||!sec) return;
    bar.classList.toggle("away", sec.getBoundingClientRect().top < window.innerHeight*0.75);
  }
  window.addEventListener("scroll",syncPaybar,{passive:true});
  window.addEventListener("resize",syncPaybar);

  /* ---------- 操作 ---------- */
  function arm(key){ armed=key; clearTimeout(armTimer); armTimer=setTimeout(()=>{armed=null;render();},4000); render(); }

  // サーバーと同じ決め方で、次の番号札を予想する（1〜枚数をくり返す。まだ渡していない番号は飛ばす）
  function predictNo(day,test){
    const list=orders.filter(o=>o.day===day&&!!o.test===!!test&&!o.paper);
    const inUse=new Set(list.filter(o=>o.status==="cooking"||o.status==="ready").map(o=>Number(o.no)));
    const lastNo=list.length?Number(list[list.length-1].no)||0:0;
    if(!tagCount) return Math.max(0,...list.map(o=>Number(o.no)||0))+1;
    for(let i=1;i<=tagCount;i++){ const c=((lastNo+i-1)%tagCount)+1; if(!inUse.has(c)) return c; }
    return null;
  }

  // 確定を押したらすぐに番号を出し、サーバーへの保存は後ろで行う
  function place(){
    const items=cartItems(); if(!items.length) return;
    const total=cartTotal(); const p=getPaid()||total; if(p<total) return;
    const t=today(), no=predictNo(t,testMode);
    if(no==null){ toast("番号札がすべて使用中です。受け渡しが終わるまで待ってください"); return; }
    const saved={cart:Object.assign({},cart),lotCart:lotCart.slice(),paidStr:paidStr};
    const tmpItems=JSON.parse(JSON.stringify(items));
    tmpItems.forEach(i=>{ if(i.lotTicket&&i.round==null) i.round=lotRound; });   // 保存中も、その番号は「出た」扱いにする
    const tmp={id:"tmp"+Date.now(),no:no,day:t,items:tmpItems,total:total,paid:p,change:p-total,
      status:"cooking",createdAt:now(),test:testMode,pending:true};
    orders=orders.concat([tmp]);
    cart={}; lotCart=[]; lotPick=null; paidStr=""; selCat=null;
    showOverlay(tmp); render();
    writing++; writeSeq++;
    wq=wq.then(()=>api("addOrder",items,p)).then(res=>{
      if(writing<=1) applyState(res.state);
      else if(res.state&&res.state.ver) ver=String(Math.max(Number(ver)||0,Number(res.state.ver)));
      confirmOverlay(tmp,res.order);
    }).catch(e=>{
      orders=orders.filter(o=>o!==tmp);
      failOverlay(tmp);
      if(!Object.keys(cart).length&&!lotCart.length){ cart=saved.cart; lotCart=saved.lotCart; paidStr=saved.paidStr; }
      handleErr(e); render();
    }).finally(()=>{ writing--; });
  }

  document.addEventListener("click",(e)=>{
    if(role==="kitchen"&&tapAll&&dbState==="ok"&&!e.target.closest("[data-act],button,input,a,.top,.toast,.overlay")){
      const t=Date.now(); if(t-lastTap<800) return; lastTap=t;
      const first=todays().filter(o=>o.status==="cooking").sort(byCreated)[0];
      if(first){ updOrder(first.id,{status:"ready",readyAt:now()}); toast(noLabel(first)+"番を完成にしました",{label:"戻す",act:"uncook",id:first.id}); }
      return;
    }
    const b=e.target.closest("[data-act]"); if(!b||b.disabled) return;
    const a=b.dataset.act, v=b.dataset.v, id=b.dataset.id;
    switch(a){
      case "role": role=v; lsSet("stall-role",v); armed=null; render(); window.scrollTo(0,0); break;
      case "update": goLatest(); break;
      case "topay": { const s=document.getElementById("paySec"); if(s) s.scrollIntoView({behavior:"smooth",block:"start"}); break; }
      case "msign": moveSign=Number(v); render(); break;
      case "madd": {
        const amt=Math.round(Number($("#mvAmt").value)||0), memo=$("#mvMemo").value.trim();
        if(!(amt>0)){ toast("金額を入力してください"); $("#mvAmt").focus(); break; }
        const m={id:"tmp"+Date.now(),day:salesDay,amount:amt*moveSign,memo:memo,createdAt:now()};
        moves=moves.concat([m]); moveSign=-1; render();
        q(()=>api("addCashMove",m.day,m.amount,m.memo)); break;
      }
      case "mdel":
        if(armed==="m:"+id){ armed=null; moves=moves.filter(m=>m.id!==id); render(); q(()=>api("deleteCashMove",id)); }
        else arm("m:"+id);
        break;
      case "tapall": tapAll=!tapAll; lsSet("stall-tapall",tapAll?"on":"off"); render(); break;
      case "paper": editing={id:null,paper:true,items:[],time:""}; eCat=null; render(); window.scrollTo(0,0); break;
      case "sound": soundOn=!soundOn; lsSet("stall-sound",soundOn?"on":"off"); render(); break;
      case "stest": {
        try{ if(!actx) actx=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){}
        const go=()=>{
          if(!audioReady()){ toast("音を出せませんでした。消音モードや音量を確認してください"); render(); return; }
          beep(880,1,true); setTimeout(()=>beep(660,2,true),600);
          toast(soundOn?"ピッ（厨房：新しい注文）→ ピピッ（渡し口：完成）が鳴れば大丈夫です":"テスト音を鳴らしました。今は通知音がOFFなので、注文が来ても鳴りません");
          render();
        };
        if(actx&&actx.state!=="running"&&actx.resume) actx.resume().then(go,go); else go();
        break;
      }
      case "add": cart[id]=(cart[id]||0)+1; render(); break;
      case "dec": cart[id]=Math.max(0,(cart[id]||0)-1); if(!cart[id]) delete cart[id]; render(); break;
      case "clearcart": cart={}; lotCart=[]; lotPick=null; paidStr=""; selCat=null; render(); break;
      case "cat": selCat=(selCat===id?null:id); lotPick=null; render(); break;
      case "lotnum": {
        if(!lotPick||lotPick.cid!==id) lotPick={cid:id,nums:[],stage:"pick",fl:{}};
        const n=Number(v), i=lotPick.nums.indexOf(n);
        if(i>=0) lotPick.nums.splice(i,1); else lotPick.nums.push(n);
        render(); break;
      }
      case "lotclear": if(lotPick){ lotPick.nums=[]; } render(); break;
      case "lotnext": if(lotPick&&lotPick.nums.length){ lotPick.stage="confirm"; render(); } break;
      case "lotyes": {
        if(!lotPick) break;
        const c=cats.find(x=>x.id===lotPick.cid); if(!c) break;
        const fs=(c.flavors||[]).filter(f=>!f.soldOut);
        if(!fs.length&&(c.flavors||[]).length){ toast("水あめの味がすべて売り切れです"); break; }
        if(fs.length===1){ lotPick.nums.forEach(n=>{ lotPick.fl[n]=Array(lotPieces(n)).fill(fs[0].id); }); }
        lotPick.stage="flavor";
        render();
        // 味がない商品は、そのまま注文に入れる
        if(!fs.length) document.querySelector('[data-act="lotok"]')&&document.querySelector('[data-act="lotok"]').click();
        break;
      }
      case "lotfl": if(lotPick){ const n=Number(b.dataset.n); (lotPick.fl[n]=lotPick.fl[n]||[])[Number(b.dataset.i)]=id; render(); } break;
      case "lotall": if(lotPick){ lotPick.nums.forEach(n=>{ lotPick.fl[n]=Array(lotPieces(n)).fill(id); }); render(); } break;
      case "lotback":
        if(lotPick&&lotPick.stage==="flavor") lotPick.stage="confirm";
        else if(lotPick&&lotPick.stage==="confirm") lotPick.stage="pick";
        else lotPick=null;
        render(); break;
      case "lotok": {
        if(!lotPick) break;
        const c=cats.find(x=>x.id===lotPick.cid); if(!c) break;
        const fs=(c.flavors||[]).filter(f=>!f.soldOut);
        const es=[];
        for(const n of lotPick.nums.slice().sort((a,b)=>a-b)){
          const k=lotPieces(n), fl=fs.length?(lotPick.fl[n]||[]).slice(0,k):[];
          if(fs.length&&fl.filter(Boolean).length<k){ toast(n+"番の味をすべて選んでください"); es.length=0; break; }
          es.push({cid:c.id,num:n,fl:fl});
        }
        if(!es.length) break;
        if(editing){
          editing.items=mergeLines(editing.items.concat(...es.map(lotLines)));
          eCat=null;
        } else lotCart.push(...es);
        lotPick=null; render(); break;
      }
      case "lotdel": { lotCart.splice(Number(b.dataset.i),1); render(); break; }
      case "lotreset":
        if(armed==="lotreset"){ armed=null; lotRound++; render(); toast("くじをリセットしました"); q(()=>api("resetLottery")); }
        else arm("lotreset");
        break;
      case "key":
        if(v==="back") paidStr=paidStr.slice(0,-1);
        else if(paidStr.length<6) paidStr=(paidStr+v).replace(/^0+/,"");
        render(); break;
      case "pay":
        if(v==="exact") paidStr=cartTotal()?String(cartTotal()):""; else paidStr="";
        render(); break;
      case "place": place(); break;
      case "closeov": { const o=b.closest(".overlay"); if(o) o.remove(); break; }
      case "cancel":
        if(armed===id){ armed=null; updOrder(id,{status:"canceled",canceledAt:now()}); }
        else arm(id);
        break;
      case "ready": updOrder(id,{status:"ready",readyAt:now()}); break;
      case "uncook": updOrder(id,{status:"cooking",readyAt:null}); break;
      case "done": updOrder(id,{status:"done",doneAt:now()}); break;
      case "undone": updOrder(id,{status:"ready",doneAt:null}); break;
      case "day": salesDay=v; editing=null; render(); break;
      case "asign": adjSign=Number(v); render(); break;
      case "aadd": {
        const amt=Math.round(Number($("#adjAmt").value)||0), memo=$("#adjMemo").value.trim();
        if(!(amt>0)){ toast("金額を入力してください"); $("#adjAmt").focus(); break; }
        const a={id:"tmp"+Date.now(),day:salesDay,amount:amt*adjSign,memo:memo,createdAt:now()};
        adjs=adjs.concat([a]); adjSign=1; render();
        q(()=>api("addAdjustment",a.day,a.amount,a.memo)); break;
      }
      case "adel":
        if(armed==="a:"+id){ armed=null; adjs=adjs.filter(a=>a.id!==id); render(); q(()=>api("deleteAdjustment",id)); }
        else arm("a:"+id);
        break;
      case "restore": { const o=orders.find(x=>x.id===id); if(o) updOrder(id,{status:o.doneAt?"done":(o.readyAt?"ready":"cooking"),canceledAt:null}); break; }
      case "edit": {
        const o=orders.find(x=>x.id===id); if(!o) break;
        editing={id:id,items:JSON.parse(JSON.stringify(o.items||[]))}; eCat=null; render(); window.scrollTo(0,0); break;
      }
      case "ecancel": editing=null; lotPick=null; render(); break;
      case "eqty": { const i=editing&&editing.items[Number(b.dataset.i)]; if(i){ i.qty=Math.max(0,i.qty+Number(v)); render(); } break; }
      case "ecat": eCat=(eCat===id?null:id); lotPick=null; render(); break;
      case "eltdel": {
        if(!editing) break;
        const t=editing.items[Number(b.dataset.i)]; if(!t||!t.lotTicket) break;
        const cid=String(t.id).split("|")[1]; const k=lotPieces(Number(t.lot));
        const keys=(t.fl&&t.fl.length)?t.fl.map(f=>cid+"|"+f):Array(k).fill(cid+"|");
        editing.items.splice(Number(b.dataset.i),1);
        keys.forEach(key=>{ const x=editing.items.find(i=>i.bonus&&i.id===key); if(x) x.qty--; });
        editing.items=editing.items.filter(i=>i.qty>0); render(); break;
      }
      case "eadd": {
        if(!editing) break;
        const ex=editing.items.find(i=>i.id===id);
        if(ex) ex.qty++; else { const r=lookup(id); if(!r) break;
          editing.items.push({id:id,name:r.cat.name+(r.fl?" "+r.fl.name:""),cat:r.cat.name,flavor:r.fl?r.fl.name:"",price:Number(r.cat.price)||0,qty:1}); }
        render(); break;
      }
      case "esave": {
        if(!editing) break;
        const its=editing.items.filter(i=>i.qty>0); if(!its.length) break;
        if(editing.paper){
          const tEl=$("#paperTime"), tv=tEl?tEl.value:"", d=salesDay;
          editing=null; render(); toast("紙の注文を追加しました");
          q(()=>api("addPaperOrder",d,its,tv)); break;
        }
        const o=orders.find(x=>x.id===editing.id), eid=editing.id;
        if(o){ o.items=its; o.total=its.reduce((a,i)=>a+i.price*i.qty,0); }
        editing=null; render(); toast("修正を保存しました");
        q(()=>api("updateOrderItems",eid,its)); break;
      }
      case "seed":
        if(cats.length) break;
        saveMenu([{n:"水あめ",lot:true},{n:"トロピカルジュース",lot:false}].map((x,i)=>({id:"c"+Date.now().toString(36)+i,name:x.n,price:0,lottery:x.lot,flavors:[]})),defaultMin,true); break;
      case "clot": {
        const cs=cloneCats(), c=cs.find(x=>x.id===id); if(!c) break;
        c.lottery=!c.lottery; Object.keys(cart).forEach(k=>{ if(k.split("|")[0]===id) delete cart[k]; });
        lotCart=lotCart.filter(e=>e.cid!==id); saveMenu(cs,defaultMin); break;
      }
      case "cadd": {
        const n=$("#newCat").value.trim(), pv=$("#newCatPrice").value, pr=Number(pv)||0;
        if(!n){ toast("商品名を入力してください"); $("#newCat").focus(); break; }
        if(cats.some(c=>c.name===n)){ toast("同じ名前の商品がすでにあります"); break; }
        if(!(pr>=0)){ toast("値段を入力してください"); break; }
        const cs=cloneCats(); cs.push({id:"c"+Date.now().toString(36)+Math.random().toString(36).slice(2,5),name:n,price:Math.round(pr),flavors:[]});
        saveMenu(cs,defaultMin); toast("「"+n+"」を追加しました"); break;
      }
      case "cdel":
        if(armed==="c:"+id){
          armed=null;
          if(cats.length<=1){ toast("最後の1つは削除できません。名前を変えて使ってください"); render(); break; }
          Object.keys(cart).forEach(k=>{ if(k.split("|")[0]===id) delete cart[k]; });
          if(selCat===id) selCat=null;
          saveMenu(cloneCats().filter(c=>c.id!==id),defaultMin);
        } else arm("c:"+id);
        break;
      case "teston": testMode=true; render(); q(()=>api("setTestMode",true)); break;
      case "testoff":
        if(armed==="test-off"||!orders.some(o=>o.test)){ armed=null; testMode=false; orders=orders.filter(o=>!o.test); render(); q(()=>api("setTestMode",false)); }
        else arm("test-off");
        break;
      case "testdel":
        if(armed==="test-del"){ armed=null; orders=orders.filter(o=>!o.test); render(); q(()=>api("deleteTestOrders")); }
        else arm("test-del");
        break;
      case "fsold": {
        const cs=cloneCats(), c=cs.find(x=>x.id===b.dataset.cid), f=c&&(c.flavors||[]).find(x=>x.id===id);
        if(f){ f.soldOut=!f.soldOut; saveMenu(cs,defaultMin); } break;
      }
      case "fdel":
        if(armed==="f:"+id){ armed=null; const cs=cloneCats(), c=cs.find(x=>x.id===b.dataset.cid);
          if(c){ c.flavors=(c.flavors||[]).filter(x=>x.id!==id); delete cart[c.id+"|"+id]; saveMenu(cs,defaultMin); } }
        else arm("f:"+id);
        break;
      case "fadd": {
        const inp=document.getElementById("nf-"+id), n=inp?inp.value.trim():"";
        if(!n){ toast("味の名前を入力してください"); if(inp) inp.focus(); break; }
        const cs=cloneCats(), c=cs.find(x=>x.id===id); if(!c) break;
        c.flavors=c.flavors||[]; c.flavors.push({id:"f"+Date.now().toString(36)+Math.random().toString(36).slice(2,5),name:n,soldOut:false});
        inp.value=""; saveMenu(cs,defaultMin); break;
      }
    }
  });

  document.addEventListener("change",(e)=>{
    const el=e.target;
    if(el.dataset&&el.dataset.cf){

      else { const pr=Number(el.value); if(!(pr>=0)||el.value===""){ el.value=c.price; toast("値段を入力してください"); return; } c.price=Math.round(pr); }
      saveMenu(cs,defaultMin);
    } else if(el.dataset&&el.dataset.ff){
      const cs=cloneCats(), c=cs.find(x=>x.id===el.dataset.cid), f=c&&(c.flavors||[]).find(x=>x.id===el.dataset.id); if(!f) return;
      const n=el.value.trim(); if(!n){ el.value=f.name; toast("味の名前は空にできません"); return; }
      f.name=n; saveMenu(cs,defaultMin);
    } else if(el.dataset&&el.dataset.ep!=null&&editing){
      const i=editing.items[Number(el.dataset.ep)]; if(!i) return;
      const pr=Number(el.value); if(!(pr>=0)||el.value===""){ el.value=i.price; return; }
      i.price=Math.round(pr); scheduleRender();
    } else if(el.id==="regFloat"){
      saveReg(salesDay,{float:el.value===""?null:Math.max(0,Math.round(Number(el.value)||0))});
    } else if(el.id==="regCounted"){
      saveReg(salesDay,{counted:el.value===""?null:Math.max(0,Math.round(Number(el.value)||0))});
    } else if(el.dataset&&el.dataset.coin){
      const cs={}; cs[el.dataset.coin]=Math.max(0,Math.round(Number(el.value)||0));
      saveReg(salesDay,{coins:cs});
    } else if(el.id==="paperTime"&&editing){ editing.time=el.value;
    } else if(el.id==="dayPick"){
      if(/^\d{4}-\d{2}-\d{2}$/.test(el.value)){ salesDay=el.value; editing=null; el.blur(); render(); }
    } else if(el.id==="titleIn"){
      const t=el.value.trim().slice(0,40); appTitle=t;
      const tt=t||DEFAULT_TITLE; $("#appTitle").textContent=tt; document.title=tt;
      q(()=>api("setTitle",t)); toast("表示名を「"+tt+"」にしました");
    } else if(el.id==="lotMax"){
      const n=Math.round(Number(el.value)); if(!(n>=1&&n<=999)){ el.value=lotMax; toast("1〜999で入力してください"); return; }
      lotMax=n; q(()=>api("setLotteryMax",n)); toast("くじを"+n+"枚にしました");
    } else if(el.id==="tagCount"){
      const n=Math.round(Number(el.value)); if(!(n>=0&&n<=999)){ el.value=tagCount; toast("0〜999で入力してください"); return; }
      tagCount=n; q(()=>api("setTagCount",n)); toast("番号札を"+(n?n+"枚":"制限なし")+"にしました");
    } else if(el.id==="defMin"){
      const n=Number(el.value); if(!(n>=1&&n<=30)){ el.value=defaultMin; toast("1〜30分で入力してください"); return; }
      saveMenu(cloneCats(),n);
    }
  });
  document.addEventListener("keydown",(e)=>{
    if(e.key==="Enter"&&(e.target.id==="newCat"||e.target.id==="newCatPrice")){ const b=document.querySelector('[data-act="cadd"]'); if(b) b.click(); return; }
    if(e.key==="Enter"&&e.target.dataset&&e.target.dataset.nf){ const b=document.querySelector('[data-act="fadd"][data-id="'+e.target.dataset.nf+'"]'); if(b) b.click(); }
  });

  /* ---------- 通知判定 ---------- */
  function notify(){
    const cook=orders.filter(o=>o.status==="cooking"), rdy=orders.filter(o=>o.status==="ready");
    if(!firstSnap){
      const newCook=cook.filter(o=>!seenIds.has(o.id));
      const newReady=rdy.filter(o=>!readyIds.has(o.id));
      if(role==="kitchen"&&newCook.length){ newCook.forEach(o=>fresh.add(o.id)); beep(880,1); }
      if(role==="pickup"&&newReady.length){ newReady.forEach(o=>fresh.add(o.id)); beep(660,2); }
    }
    seenIds=new Set(orders.map(o=>o.id));
    readyIds=new Set(rdy.map(o=>o.id));
    firstSnap=false;
  }

  /* ---------- 起動 ---------- */
  render();
  setInterval(()=>{ if(role!=="menu"&&role!=="sales") scheduleRender(); else { const d=new Date(); $("#clock").textContent=d.getHours()+":"+pad(d.getMinutes()); } },20000);

  /* ---------- 新しいデプロイへの自動切り替え ---------- */
  let updateReady=false, updateTried=false;
  function goLatest(){
    // GitHub Pages は数分間古いページを返すことがあるので、毎回ちがうURLで開き直して必ず最新を読む
    if(viaFetch||!window.APP_URL){ location.replace(location.pathname+"?v="+Date.now()); return; }
    const u=window.APP_URL;
    try{ if(u){ window.open(u,"_top"); return; } }catch(e){}
    try{ location.reload(); }catch(e){}
  }
  // GitHub Pages：このページ自身をもう一度読み込んで、中身が変わっていたら新しいバージョン
  async function pageText(){
    const r=await fetch(location.pathname+"?v="+Date.now(),{cache:"no-store",credentials:"omit"});
    if(!r.ok) throw new Error(); return r.text();
  }
  function safeToReload(){
    // 入力中・注文の途中・修正画面・番号の表示中は切り替えない
    return !Object.keys(cart).length && !paidStr && !busy && !editing && !writing
      && !focusedInView() && !document.querySelector(".overlay");
  }
  function tryUpdate(){
    if(!updateReady) return;
    $("#updbar").hidden=false;
    if(!updateTried&&safeToReload()){ updateTried=true; goLatest(); }
  }
  // GitHub にある最新の index.html を読んで、バージョンが自分と違えば新しいものに切り替える
  async function checkBuild(){
    if(location.hostname==="script.google.com"||location.hostname.endsWith("googleusercontent.com")){
      if(!hasGAS()||!window.APP_BUILD||updateReady) return;
      try{ const b=await api("getBuild"); if(b&&b!==window.APP_BUILD){ updateReady=true; tryUpdate(); } }catch(e){}
      return;
    }
    if(updateReady||location.protocol==="file:"||!BUILD) return;
    try{
      const m=(await pageText()).match(/<meta name="app-build" content="([^"]*)"/);
      const latest=m&&m[1];
      if(!latest||latest===BUILD) return;
      // 同じバージョンへの切り替えは3回まで（GitHub側の反映待ちで、何度も読み直し続けないように）
      let tries=0; try{ tries=Number(sessionStorage.getItem("upd:"+latest))||0; }catch(e){}
      if(tries>=3) return;
      try{ sessionStorage.setItem("upd:"+latest,String(tries+1)); }catch(e){}
      updateReady=true; tryUpdate();
    }catch(e){}
  }


  // 開いた直後と、30秒ごと・画面に戻ったときに新しいバージョンを確認（つながっていなくても確認する）
  checkBuild();
  setInterval(checkBuild,30000);
  setInterval(tryUpdate,3000);
  document.addEventListener("visibilitychange",()=>{ if(!document.hidden) checkBuild(); });
  window.addEventListener("pageshow",(e)=>{ if(e.persisted) checkBuild(); });

  loadConfig().then(()=>{
  if(!hasGAS()){ dbState="none"; render(); }
  else {
    poll(true);
    setInterval(()=>poll(false),1000);
    document.addEventListener("visibilitychange",()=>{ if(!document.hidden) poll(true); });
  }
  });
})();
</script>
</body>
</html>
